[package]
name = "diskwatch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.4"
ferrisetw = { version = "1.2.0", features = ["serde"] }
humantime = "2.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
tiny_http = "=0.12.0"
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Services",
    "Win32_System_EventLog",
] }

[profile.release]
lto = true
